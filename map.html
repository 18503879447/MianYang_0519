<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绵阳市建筑风险监测系统 - 一张图</title>

    <!-- OpenLayers CSS & JS - 使用官方 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css" />
    <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --primary: #0F172A;
            --secondary: #334155;
            --cta: #0369A1;
            --background: #F8FAFC;
            --text: #020617;
            --accent: #0EA5E9;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
        }
        
        * {
            font-family: 'Lato', sans-serif;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'EB Garamond', serif;
        }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
        
        .nav-link {
            position: relative;
            transition: color 0.2s ease;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        
        .nav-link:hover::after {
            width: 100%;
        }
        
        /* Full screen map */
        #map {
            width: 100%;
            height: calc(100vh - 64px);
            position: absolute;
            top: 64px;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        /* Map controls */
        .map-control-panel {
            position: absolute;
            top: 80px;
            right: 20px;
            z-index: 1000;
            width: 280px;
        }
        
        .layer-switcher {
            position: absolute;
            top: 80px;
            left: 20px;
            z-index: 1000;
            width: 220px;
        }
        
        .search-box {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 400px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 8px;
        }
        
        .control-btn {
            transition: all 0.2s ease;
        }
        
        .control-btn:hover {
            background: rgba(14, 165, 233, 0.2);
        }
        
        /* OL overrides for dark theme */
        .ol-zoom button,
        .ol-rotate button,
        .ol-attribution button {
            background: rgba(30, 41, 59, 0.9) !important;
            color: #fff !important;
            border: 1px solid rgba(148, 163, 184, 0.2) !important;
        }
        
        .ol-zoom button:hover,
        .ol-rotate button:hover,
        .ol-attribution button:hover {
            background: rgba(14, 165, 233, 0.3) !important;
        }
        
        .ol-control {
            background: transparent !important;
        }
        
        /* Toast notification */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            z-index: 3000;
            animation: fadeInOut 2s ease-in-out forwards;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); }
        }
    </style>
</head>
<body class="text-gray-100">
    <!-- Navigation Bar -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass-panel border-b border-gray-700/30 h-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full">
            <div class="flex items-center justify-between h-full">
                <div class="flex items-center space-x-3">
                    <svg class="w-8 h-8 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                    <span class="text-xl font-semibold">绵阳市建筑风险监测系统</span>
                </div>
                
                <div class="flex items-center space-x-6">
                    <a href="index.html" class="nav-link text-gray-300 hover:text-white">首页</a>
                    <a href="map.html" class="nav-link text-sky-400 font-medium">一张图</a>
                    <a href="analysis.html" class="nav-link text-gray-300 hover:text-white">风险研判</a>
                    <a href="data.html" class="nav-link text-gray-300 hover:text-white">数据管理</a>
                    <a href="profile.html" class="nav-link text-gray-300 hover:text-white">日志与中心</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button class="p-2 text-gray-400 hover:text-white transition-colors duration-200" aria-label="全屏切换" onclick="toggleFullScreen()">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                        </svg>
                    </button>
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center cursor-pointer">
                        <span class="text-sm font-medium">管</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Search Box -->
    <div class="search-box">
        <div class="glass-panel rounded-lg p-2 flex items-center space-x-2">
            <svg class="w-5 h-5 text-gray-400 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input type="text" id="searchInput" placeholder="搜索地点、建筑、传感器..." class="flex-1 bg-transparent border-none outline-none text-white px-2 py-1 placeholder-gray-500">
            <button class="px-4 py-1.5 bg-sky-600 hover:bg-sky-500 rounded text-sm transition-colors duration-200" onclick="searchLocation()">
                搜索
            </button>
        </div>
    </div>

    <!-- Layer Switcher -->
    <div class="layer-switcher glass-panel rounded-lg p-4">
        <h3 class="text-sm font-semibold mb-3 text-gray-300">图层控制</h3>
        <div class="space-y-2">
            <label class="flex items-center space-x-2 cursor-pointer control-btn p-2 rounded">
                <input type="checkbox" id="layerSatellite" checked class="w-4 h-4" onchange="toggleLayer('satellite')">
                <span class="text-sm">卫星影像</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer control-btn p-2 rounded">
                <input type="checkbox" id="layerRisk" checked class="w-4 h-4" onchange="toggleLayer('risk')">
                <span class="text-sm">风险等级</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer control-btn p-2 rounded">
                <input type="checkbox" id="layerSensors" checked class="w-4 h-4" onchange="toggleLayer('sensors')">
                <span class="text-sm">传感器点位</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer control-btn p-2 rounded">
                <input type="checkbox" id="layerBuildings" class="w-4 h-4" onchange="toggleLayer('buildings')">
                <span class="text-sm">建筑轮廓</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer control-btn p-2 rounded">
                <input type="checkbox" id="layerDisasters" class="w-4 h-4" onchange="toggleLayer('disasters')">
                <span class="text-sm">历史灾害</span>
            </label>
        </div>
        
        <div class="mt-4 pt-4 border-t border-gray-700">
            <h3 class="text-sm font-semibold mb-3 text-gray-300">风险图例</h3>
            <div class="space-y-2">
                <div class="legend-item">
                    <div class="legend-color bg-green-500"></div>
                    <span class="text-xs text-gray-300">低风险</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color bg-yellow-500"></div>
                    <span class="text-xs text-gray-300">中风险</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color bg-orange-500"></div>
                    <span class="text-xs text-gray-300">较高风险</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color bg-red-500"></div>
                    <span class="text-xs text-gray-300">高风险</span>
                </div>
            </div>
        </div>
        
        <div class="mt-4 pt-4 border-t border-gray-700">
            <div class="text-xs text-gray-400">
                <div class="flex justify-between mb-1">
                    <span>监测点</span>
                    <span class="text-sky-400">3,254</span>
                </div>
                <div class="flex justify-between mb-1">
                    <span>在线率</span>
                    <span class="text-green-400">98.5%</span>
                </div>
                <div class="flex justify-between">
                    <span>最后更新</span>
                    <span id="lastUpdateTime">--:--:--</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Map Control Panel -->
    <div class="map-control-panel glass-panel rounded-lg p-4">
        <h3 class="text-sm font-semibold mb-3 text-gray-300">快速操作</h3>
        <div class="grid grid-cols-2 gap-2">
            <button class="control-btn p-2 rounded border border-gray-700 text-xs" onclick="zoomToExtent()">
                <svg class="w-4 h-4 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064"></path>
                </svg>
                全市范围
            </button>
            <button class="control-btn p-2 rounded border border-gray-700 text-xs" onclick="centerOnRiskArea()">
                <svg class="w-4 h-4 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
                风险区域
            </button>
            <button class="control-btn p-2 rounded border border-gray-700 text-xs" onclick="exportMapImage()">
                <svg class="w-4 h-4 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                导出地图
            </button>
            <button class="control-btn p-2 rounded border border-gray-700 text-xs" onclick="refreshLayers()">
                <svg class="w-4 h-4 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                刷新数据
            </button>
        </div>
    </div>

    <!-- Map Container - 关键：id 是 "map" -->
    <div id="map"></div>

    <!-- Sensor Detail Modal -->
    <div id="sensorModal" class="fixed inset-0 bg-black/60 z-[2000] hidden items-center justify-center" onclick="closeSensorModal(event)">
        <div class="glass-panel rounded-lg p-6 w-full max-w-md mx-4" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold">传感器详情</h3>
                <button class="text-gray-400 hover:text-white" onclick="closeSensorModal()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="sensorContent"></div>
        </div>
    </div>

    <script>
        // ========== 地图全局变量 ==========
        let map;
        let layers = {};
        
        // 绵阳中心坐标 (经度, 纬度) -> 投影坐标
        const MIANYANG_CENTER = ol.proj.fromLonLat([104.7468, 31.4677]);
        
        // ========== 样式函数 ==========
        function createRiskStyle() {
            return function(feature) {
                const riskLevel = feature.get('riskLevel');
                let color;
                switch(riskLevel) {
                    case 'high': color = 'rgba(239, 68, 68, 0.6)'; break;
                    case 'medium-high': color = 'rgba(249, 115, 22, 0.6)'; break;
                    case 'medium': color = 'rgba(245, 158, 11, 0.6)'; break;
                    case 'low': color = 'rgba(16, 185, 129, 0.6)'; break;
                    default: color = 'rgba(148, 163, 184, 0.6)';
                }
                return new ol.style.Style({
                    fill: new ol.style.Fill({ color: color }),
                    stroke: new ol.style.Stroke({ color: 'rgba(255, 255, 255, 0.8)', width: 1 })
                });
            };
        }
        
        function createSensorStyle() {
            return function(feature) {
                const status = feature.get('status');
                const color = status === 'online' ? '#10B981' : '#EF4444';
                return new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: 8,
                        fill: new ol.style.Fill({ color: color }),
                        stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                    })
                });
            };
        }
        
        // ========== 生成随机多边形 ==========
        function createRandomPolygon(center, radius) {
            const points = [];
            const numPoints = 6 + Math.floor(Math.random() * 4);
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * 2 * Math.PI;
                const r = radius * (0.7 + Math.random() * 0.3);
                points.push([center[0] + r * Math.cos(angle), center[1] + r * Math.sin(angle)]);
            }
            points.push(points[0]);
            return points;
        }
        
        // ========== 填充模拟数据 ==========
        function populateMockData() {
            const riskLevels = ['low', 'medium', 'medium-high', 'high'];
            // 风险区域
            for (let i = 0; i < 20; i++) {
                const coords = [MIANYANG_CENTER[0] + (Math.random() - 0.5) * 50000, MIANYANG_CENTER[1] + (Math.random() - 0.5) * 50000];
                const polygon = createRandomPolygon(coords, 5000 + Math.random() * 10000);
                const feature = new ol.Feature({
                    geometry: new ol.geom.Polygon([polygon]),
                    riskLevel: riskLevels[Math.floor(Math.random() * riskLevels.length)],
                    type: 'risk-zone'
                });
                layers.risk.getSource().addFeature(feature);
            }
            // 传感器点位
            for (let i = 0; i < 50; i++) {
                const coords = [MIANYANG_CENTER[0] + (Math.random() - 0.5) * 40000, MIANYANG_CENTER[1] + (Math.random() - 0.5) * 40000];
                const feature = new ol.Feature({
                    geometry: new ol.geom.Point(coords),
                    type: 'sensor',
                    id: 'S' + String(i + 1).padStart(4, '0'),
                    name: '传感器 #' + (i + 1),
                    status: Math.random() > 0.1 ? 'online' : 'offline',
                    value: (Math.random() * 100).toFixed(2),
                    lastUpdate: new Date().toLocaleTimeString('zh-CN')
                });
                layers.sensors.getSource().addFeature(feature);
            }
        }
        
        // ========== 初始化地图（关键修复：target 必须与容器 id 一致）==========
        function initMap() {
            // 底图 - 卫星影像
            layers.satellite = new ol.layer.Tile({
                source: new ol.source.XYZ({
                    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
                }),
                visible: true
            });
            
            // 风险图层
            layers.risk = new ol.layer.Vector({
                source: new ol.source.Vector(),
                style: createRiskStyle(),
                visible: true
            });
            
            // 传感器图层
            layers.sensors = new ol.layer.Vector({
                source: new ol.source.Vector(),
                style: createSensorStyle(),
                visible: true
            });
            
            // 建筑轮廓图层（预留）
            layers.buildings = new ol.layer.Vector({
                source: new ol.source.Vector(),
                visible: false
            });
            
            // 灾害图层（预留）
            layers.disasters = new ol.layer.Vector({
                source: new ol.source.Vector(),
                visible: false
            });
            
            // ✅ 关键修复：target 必须与 HTML 容器 id 一致，容器 id 是 "map"
            map = new ol.Map({
                target: 'map',        // ← 改成 'map'，因为容器是 <div id="map">
                layers: [
                    layers.satellite,
                    layers.risk,
                    layers.sensors,
                    layers.buildings,
                    layers.disasters
                ],
                view: new ol.View({
                    center: MIANYANG_CENTER,
                    zoom: 11,
                    minZoom: 8,
                    maxZoom: 18
                }),
                controls: ol.control.defaults.defaults({
                    zoom: true,
                    rotate: false,
                    attribution: true
                })
            });
            
            // 点击传感器显示详情
            map.on('click', function(evt) {
                const feature = map.forEachFeatureAtPixel(evt.pixel, function(feature) {
                    return feature;
                });
                if (feature && feature.get('type') === 'sensor') {
                    showSensorDetail(feature);
                }
            });
            
            // 鼠标悬停改变样式
            map.on('pointermove', function(evt) {
                const feature = map.forEachFeatureAtPixel(evt.pixel, function(feature) {
                    return feature;
                });
                map.getTargetElement().style.cursor = (feature && feature.get('type') === 'sensor') ? 'pointer' : 'auto';
            });
            
            // 填充模拟数据
            populateMockData();
            
            // 更新时间显示
            updateTime();
            setInterval(updateTime, 1000);
            
            console.log('地图初始化成功，容器ID: map');
        }
        
        // ========== 显示传感器详情 ==========
        let sensorChart = null;
        
        function showSensorDetail(feature) {
            const data = feature.getProperties();
            const content = document.getElementById('sensorContent');
            content.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-3 h-3 rounded-full ${data.status === 'online' ? 'bg-green-500' : 'bg-red-500'}"></div>
                        <span class="text-sm text-gray-300">${data.status === 'online' ? '在线' : '离线'}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-gray-800/50 rounded p-3">
                            <div class="text-xs text-gray-400 mb-1">传感器 ID</div>
                            <div class="font-mono text-sm">${data.id}</div>
                        </div>
                        <div class="bg-gray-800/50 rounded p-3">
                            <div class="text-xs text-gray-400 mb-1">读数</div>
                            <div class="text-lg font-bold text-sky-400">${data.value}</div>
                        </div>
                    </div>
                    <div class="bg-gray-800/50 rounded p-3">
                        <div class="text-xs text-gray-400 mb-2">最近 7 天趋势</div>
                        <canvas id="sensorChart" height="150"></canvas>
                    </div>
                    <div class="text-xs text-gray-400">最后更新：${data.lastUpdate}</div>
                    <div class="flex space-x-2 pt-2">
                        <button class="flex-1 px-3 py-2 bg-sky-600 hover:bg-sky-500 rounded text-sm">查看详情</button>
                        <button class="flex-1 px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm">历史记录</button>
                    </div>
                </div>
            `;
            
            const modal = document.getElementById('sensorModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // 初始化图表
            setTimeout(() => {
                const canvas = document.getElementById('sensorChart');
                if (canvas && typeof Chart !== 'undefined') {
                    if (sensorChart) sensorChart.destroy();
                    const ctx = canvas.getContext('2d');
                    const gradient = ctx.createLinearGradient(0, 0, 0, 150);
                    gradient.addColorStop(0, 'rgba(14, 165, 233, 0.3)');
                    gradient.addColorStop(1, 'rgba(14, 165, 233, 0)');
                    sensorChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                            datasets: [{
                                data: Array.from({length: 7}, () => 80 + Math.random() * 40),
                                borderColor: '#0EA5E9',
                                backgroundColor: gradient,
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4,
                                pointRadius: 3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { grid: { color: 'rgba(148, 163, 184, 0.1)' }, ticks: { color: '#9CA3AF', font: { size: 10 } } },
                                y: { grid: { color: 'rgba(148, 163, 184, 0.1)' }, ticks: { color: '#9CA3AF', font: { size: 10 } } }
                            }
                        }
                    });
                }
            }, 100);
        }
        
        function closeSensorModal(event) {
            if (!event || event.target === document.getElementById('sensorModal')) {
                document.getElementById('sensorModal').classList.add('hidden');
                document.getElementById('sensorModal').classList.remove('flex');
            }
        }
        
        // ========== 图层控制 ==========
        function toggleLayer(layerName) {
            if (layers[layerName]) {
                const newVisible = !layers[layerName].getVisible();
                layers[layerName].setVisible(newVisible);
                showToast(`${getLayerChineseName(layerName)} ${newVisible ? '已显示' : '已隐藏'}`);
            }
        }
        
        function getLayerChineseName(layerName) {
            const names = { satellite: '卫星影像', risk: '风险等级', sensors: '传感器点位', buildings: '建筑轮廓', disasters: '历史灾害' };
            return names[layerName] || layerName;
        }
        
        // ========== 地图操作函数 ==========
        function zoomToExtent() {
            if (map) {
                map.getView().animate({ center: MIANYANG_CENTER, zoom: 11, duration: 500 });
                showToast('已缩放至全市范围');
            }
        }
        
        function centerOnRiskArea() {
            if (map && layers.risk) {
                const features = layers.risk.getSource().getFeatures();
                const highRiskFeatures = features.filter(f => f.get('riskLevel') === 'high');
                if (highRiskFeatures.length > 0) {
                    const extent = highRiskFeatures[0].getGeometry().getExtent();
                    map.getView().fit(extent, { duration: 500, padding: [50, 50, 50, 50], maxZoom: 14 });
                    showToast('已定位到高风险区域');
                } else {
                    showToast('未找到高风险区域');
                }
            }
        }
        
        function exportMapImage() {
            if (map) {
                map.once('rendercomplete', function() {
                    const canvas = document.querySelector('#map canvas');
                    if (canvas) {
                        const dataURL = canvas.toDataURL('image/png');
                        const link = document.createElement('a');
                        link.download = '绵阳风险地图_' + new Date().toISOString().slice(0, 10) + '.png';
                        link.href = dataURL;
                        link.click();
                        showToast('地图导出成功');
                    }
                });
                map.renderSync();
            }
        }
        
        function refreshLayers() {
            if (layers.sensors && layers.sensors.getSource()) {
                layers.sensors.getSource().clear();
            }
            if (layers.risk && layers.risk.getSource()) {
                layers.risk.getSource().clear();
            }
            populateMockData();
            showToast('数据已刷新');
        }
        
        function searchLocation() {
            const query = document.getElementById('searchInput').value.trim();
            if (query && map) {
                showToast(`搜索：“${query}” - 演示模式`);
                const randomOffset = [(Math.random() - 0.5) * 20000, (Math.random() - 0.5) * 20000];
                map.getView().animate({
                    center: [MIANYANG_CENTER[0] + randomOffset[0], MIANYANG_CENTER[1] + randomOffset[1]],
                    zoom: 13,
                    duration: 1000
                });
            }
        }
        
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
        
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN');
            const el = document.getElementById('lastUpdateTime');
            if (el) el.textContent = timeStr;
        }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
