<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绵阳市建筑风险监测系统 - 风险研判</title>

    <!-- OpenLayers 官方 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css" />
    <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Turf.js 官方 CDN（用于缓冲区分析） -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

    <style>
        :root {
            --primary: #0F172A;
            --secondary: #334155;
            --cta: #0369A1;
            --background: #F8FAFC;
            --text: #020617;
            --accent: #0EA5E9;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
        }
        
        * {
            font-family: 'Lato', sans-serif;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'EB Garamond', serif;
        }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
        
        .nav-link {
            position: relative;
            transition: color 0.2s ease;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        
        .nav-link:hover::after {
            width: 100%;
        }
        
        /* Layout - 修复：确保地图容器正确显示 */
        #map {
            width: calc(100% - 320px);
            height: calc(100vh - 64px);
            position: absolute;
            top: 64px;
            left: 0;
            background: #1a1a2e;  /* 添加背景色，防止空白 */
        }
        
        .sidebar {
            width: 320px;
            height: calc(100vh - 64px);
            position: absolute;
            top: 64px;
            right: 0;
            overflow-y: auto;
        }
        
        .tool-btn {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .tool-btn:hover {
            background: rgba(14, 165, 233, 0.15);
            border-color: var(--accent);
        }
        
        .tool-btn.active {
            background: rgba(14, 165, 233, 0.25);
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
        }
        
        .result-card {
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 3px;
        }
        
        .ol-zoom button,
        .ol-rotate button {
            background: rgba(30, 41, 59, 0.9) !important;
            color: #fff !important;
            border: 1px solid rgba(148, 163, 184, 0.2) !important;
        }
        
        .ol-control {
            background: transparent !important;
        }
        
        .input-field {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 6px;
            padding: 8px 12px;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .input-field:focus {
            border-color: var(--accent);
        }
        
        .input-field::placeholder {
            color: #6B7280;
        }
        
        /* Toast 提示 */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            z-index: 3000;
            animation: fadeInOut 2s ease-in-out forwards;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); }
        }
    </style>
</head>
<body class="text-gray-100">
    <!-- Navigation Bar -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass-panel border-b border-gray-700/30 h-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full">
            <div class="flex items-center justify-between h-full">
                <div class="flex items-center space-x-3">
                    <svg class="w-8 h-8 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                    <span class="text-xl font-semibold">绵阳市建筑风险监测系统</span>
                </div>
                
                <div class="flex items-center space-x-6">
                    <a href="index.html" class="nav-link text-gray-300 hover:text-white">首页</a>
                    <a href="map.html" class="nav-link text-gray-300 hover:text-white">一张图</a>
                    <a href="analysis.html" class="nav-link text-sky-400 font-medium">风险研判</a>
                    <a href="data.html" class="nav-link text-gray-300 hover:text-white">数据管理</a>
                    <a href="profile.html" class="nav-link text-gray-300 hover:text-white">日志与中心</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 rounded text-sm transition-colors duration-200 flex items-center space-x-2" onclick="exportAnalysis()">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        <span>导出结果</span>
                    </button>
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center cursor-pointer">
                        <span class="text-sm font-medium">管</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Analysis Sidebar -->
    <div class="sidebar glass-panel border-l border-gray-700/30 p-4">
        <h2 class="text-lg font-semibold mb-4">GIS 分析工具</h2>
        
        <!-- Tool Selection -->
        <div class="space-y-2 mb-6">
            <button class="tool-btn w-full p-3 rounded-lg border border-gray-700 text-left flex items-center space-x-3 active" data-tool="buffer" onclick="selectTool('buffer')">
                <svg class="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                </svg>
                <div>
                    <div class="font-medium text-sm">缓冲区分析</div>
                    <div class="text-xs text-gray-400">指定距离范围分析</div>
                </div>
            </button>
            
            <button class="tool-btn w-full p-3 rounded-lg border border-gray-700 text-left flex items-center space-x-3" data-tool="overlay" onclick="selectTool('overlay')">
                <svg class="w-6 h-6 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"></path>
                </svg>
                <div>
                    <div class="font-medium text-sm">叠加分析</div>
                    <div class="text-xs text-gray-400">多图层交集计算</div>
                </div>
            </button>
            
            <button class="tool-btn w-full p-3 rounded-lg border border-gray-700 text-left flex items-center space-x-3" data-tool="path" onclick="selectTool('path')">
                <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
                <div>
                    <div class="font-medium text-sm">路径模拟</div>
                    <div class="text-xs text-gray-400">避险逃生路线规划</div>
                </div>
            </button>
            
            <button class="tool-btn w-full p-3 rounded-lg border border-gray-700 text-left flex items-center space-x-3" data-tool="clear" onclick="clearAnalysis()">
                <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
                <div>
                    <div class="font-medium text-sm">清除分析</div>
                    <div class="text-xs text-gray-400">重置所有分析结果</div>
                </div>
            </button>
        </div>
        
        <!-- Buffer Tool Panel -->
        <div id="bufferPanel" class="tool-panel space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">缓冲距离 (米)</label>
                <input type="number" id="bufferDistance" value="500" min="10" max="10000" class="input-field w-full">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">选择要素</label>
                <select id="bufferTarget" class="input-field w-full">
                    <option value="sensor">传感器点位</option>
                    <option value="building">建筑轮廓</option>
                    <option value="risk">风险区域</option>
                </select>
            </div>
            
            <button class="w-full px-4 py-2 bg-sky-600 hover:bg-sky-500 rounded text-sm transition-colors duration-200" onclick="runBufferAnalysis()">
                执行缓冲区分析
            </button>
            
            <div class="text-xs text-gray-400 bg-gray-800/50 rounded p-3">
                <p>操作说明：</p>
                <ul class="list-disc list-inside mt-1 space-y-1">
                    <li>设置缓冲距离</li>
                    <li>选择目标要素类型</li>
                    <li>在地图上点击要素</li>
                    <li>查看生成的缓冲区</li>
                </ul>
            </div>
        </div>
        
        <!-- Overlay Tool Panel -->
        <div id="overlayPanel" class="tool-panel space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">第一图层</label>
                <select id="overlayLayer1" class="input-field w-full">
                    <option value="risk">风险等级区划</option>
                    <option value="population">人口密度</option>
                    <option value="building">建筑分布</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">第二图层</label>
                <select id="overlayLayer2" class="input-field w-full">
                    <option value="population">人口密度</option>
                    <option value="risk">风险等级区划</option>
                    <option value="infrastructure">基础设施</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">分析类型</label>
                <select id="overlayType" class="input-field w-full">
                    <option value="intersect">交集 (Intersect)</option>
                    <option value="union">并集 (Union)</option>
                    <option value="difference">差集 (Difference)</option>
                </select>
            </div>
            
            <button class="w-full px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded text-sm transition-colors duration-200" onclick="runOverlayAnalysis()">
                执行叠加分析
            </button>
        </div>
        
        <!-- Path Tool Panel -->
        <div id="pathPanel" class="tool-panel space-y-4 hidden">
            <div class="text-xs text-gray-400 bg-gray-800/50 rounded p-3">
                <p>操作说明：</p>
                <ul class="list-disc list-inside mt-1 space-y-1">
                    <li>点击地图设置起点</li>
                    <li>点击地图设置终点</li>
                    <li>自动避开高风险区</li>
                    <li>生成最优逃生路径</li>
                </ul>
            </div>
            
            <div class="flex items-center justify-between">
                <span class="text-sm text-gray-300">起点状态:</span>
                <span id="startPointStatus" class="text-xs px-2 py-1 rounded bg-gray-700">未设置</span>
            </div>
            
            <div class="flex items-center justify-between">
                <span class="text-sm text-gray-300">终点状态:</span>
                <span id="endPointStatus" class="text-xs px-2 py-1 rounded bg-gray-700">未设置</span>
            </div>
            
            <button class="w-full px-4 py-2 bg-green-600 hover:bg-green-500 rounded text-sm transition-colors duration-200" onclick="calculatePath()">
                计算路径
            </button>
            
            <button class="w-full px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm transition-colors duration-200" onclick="resetPathPoints()">
                重置端点
            </button>
        </div>
        
        <!-- Analysis Results -->
        <div id="resultsPanel" class="mt-6 pt-6 border-t border-gray-700">
            <h3 class="text-sm font-semibold mb-3 text-gray-300">分析结果</h3>
            <div id="resultsContent" class="space-y-3">
                <div class="text-center text-gray-500 text-sm py-8">
                    暂无分析结果
                </div>
            </div>
        </div>
        
        <!-- Analysis Log -->
        <div class="mt-6 pt-6 border-t border-gray-700">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-semibold text-gray-300">研判日志</h3>
                <button class="text-xs text-sky-400 hover:text-sky-300" onclick="viewLogs()">查看全部</button>
            </div>
            <div id="logList" class="space-y-2"></div>
        </div>
    </div>

    <script>
        // ========== 全局变量 ==========
        let map;
        let analysisLayer;
        let tempLayer;
        let riskLayer;      // 保存风险图层引用，用于路径规划
        let pathPoints = { start: null, end: null };
        let currentTool = 'buffer';
        
        // 绵阳中心坐标
        const MIANYANG_CENTER = ol.proj.fromLonLat([104.7468, 31.4677]);
        
        // ========== 辅助函数 ==========
        function createRandomPolygon(center, radius) {
            const points = [];
            const numPoints = 6 + Math.floor(Math.random() * 4);
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * 2 * Math.PI;
                const r = radius * (0.7 + Math.random() * 0.3);
                points.push([center[0] + r * Math.cos(angle), center[1] + r * Math.sin(angle)]);
            }
            points.push(points[0]);
            return points;
        }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        // ========== 日志管理 ==========
        function addLog(action, details) {
            const logs = JSON.parse(localStorage.getItem('analysisLogs') || '[]');
            logs.unshift({ action, details, timestamp: new Date().toISOString() });
            if (logs.length > 50) logs.splice(50);
            localStorage.setItem('analysisLogs', JSON.stringify(logs));
            loadLogs();
        }
        
        function loadLogs() {
            const logs = JSON.parse(localStorage.getItem('analysisLogs') || '[]').slice(0, 5);
            const logList = document.getElementById('logList');
            
            if (logs.length === 0) {
                logList.innerHTML = '<div class="text-center text-gray-500 text-xs py-4">暂无日志记录</div>';
                return;
            }
            
            logList.innerHTML = logs.map(log => `
                <div class="text-xs p-2 bg-gray-800/30 rounded">
                    <div class="flex items-center justify-between">
                        <span class="text-gray-300">${log.action}</span>
                        <span class="text-gray-500">${new Date(log.timestamp).toLocaleTimeString('zh-CN')}</span>
                    </div>
                    <div class="text-gray-400 mt-1">${log.details}</div>
                </div>
            `).join('');
        }
        
        function viewLogs() {
            window.location.href = 'profile.html#logs';
        }
        
        // ========== 结果管理 ==========
        function addResult(data) {
            const resultsContent = document.getElementById('resultsContent');
            const resultCard = document.createElement('div');
            resultCard.className = 'result-card bg-gray-800/50 rounded-lg p-3 border-l-4 ' + 
                (data.type === 'buffer' ? 'border-sky-500' : 
                 data.type === 'overlay' ? 'border-purple-500' : 'border-green-500');
            
            resultCard.innerHTML = `
                <div class="flex items-start justify-between mb-2">
                    <div class="font-medium text-sm">${data.description}</div>
                    <div class="text-xs text-gray-500">${data.timestamp}</div>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    ${data.area ? `<div class="text-gray-400">面积：<span class="text-white">${data.area} km²</span></div>` : ''}
                    ${data.distance ? `<div class="text-gray-400">距离：<span class="text-white">${data.distance}</span></div>` : ''}
                </div>
                <div class="mt-2 flex space-x-2">
                    <button class="px-2 py-1 bg-sky-600/50 hover:bg-sky-600 rounded text-xs" onclick="downloadGeoJSON()">下载 GeoJSON</button>
                    <button class="px-2 py-1 bg-gray-700/50 hover:bg-gray-700 rounded text-xs" onclick="copyToClipboard()">复制数据</button>
                </div>
            `;
            
            resultsContent.insertBefore(resultCard, resultsContent.firstChild);
        }
        
        function downloadGeoJSON() {
            const features = analysisLayer.getSource().getFeatures();
            if (features.length === 0) {
                showToast('无分析结果可导出');
                return;
            }
            const geojson = new ol.format.GeoJSON().writeFeatures(features);
            const blob = new Blob([geojson], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'analysis_result_' + new Date().toISOString().slice(0, 10) + '.geojson';
            link.click();
            URL.revokeObjectURL(url);
            showToast('GeoJSON 已下载');
        }
        
        function copyToClipboard() {
            const features = analysisLayer.getSource().getFeatures();
            if (features.length === 0) {
                showToast('无数据可复制');
                return;
            }
            const geojson = new ol.format.GeoJSON().writeFeatures(features);
            navigator.clipboard.writeText(geojson).then(() => showToast('已复制到剪贴板'));
        }
        
        function exportAnalysis() {
            downloadGeoJSON();
        }
        
        // ========== 工具切换 ==========
        function selectTool(tool) {
            currentTool = tool;
            
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-tool="${tool}"]`).classList.add('active');
            
            document.querySelectorAll('.tool-panel').forEach(panel => panel.classList.add('hidden'));
            
            if (tool === 'buffer') {
                document.getElementById('bufferPanel').classList.remove('hidden');
            } else if (tool === 'overlay') {
                document.getElementById('overlayPanel').classList.remove('hidden');
            } else if (tool === 'path') {
                document.getElementById('pathPanel').classList.remove('hidden');
            }
            
            if (tempLayer) tempLayer.getSource().clear();
            
            // 路径模式时重置路径点
            if (tool === 'path') {
                pathPoints = { start: null, end: null };
                updatePathUI();
            }
        }
        
        // ========== 缓冲区分析 ==========
        function runBufferAnalysis() {
            showToast('请在地图上点击要分析的要素');
        }
        
        function runBufferOnFeature(feature) {
            const distance = parseFloat(document.getElementById('bufferDistance').value) || 500;
            const geom = feature.getGeometry();
            
            try {
                const geojson = JSON.parse(new ol.format.GeoJSON().writeGeometry(geom));
                // 检查 turf 是否可用
                if (typeof turf === 'undefined') {
                    showToast('Turf.js 未加载，无法进行缓冲区分析');
                    return;
                }
                const buffered = turf.buffer(geojson, distance / 1000, { units: 'kilometers' });
                
                const olGeom = new ol.format.GeoJSON().readGeometry(buffered);
                const resultFeature = new ol.Feature({ geometry: olGeom, type: 'buffer', distance: distance });
                
                analysisLayer.getSource().clear();
                analysisLayer.getSource().addFeature(resultFeature);
                
                addResult({
                    type: 'buffer',
                    description: `缓冲区分析：${distance}米`,
                    area: (turf.area(buffered) / 1000000).toFixed(2),
                    timestamp: new Date().toLocaleTimeString('zh-CN')
                });
                
                addLog('缓冲区分析', `${distance}米缓冲区`);
                showToast('缓冲区分析完成');
            } catch (e) {
                console.error('缓冲区分析失败:', e);
                showToast('缓冲区分析失败');
            }
        }
        
        // ========== 叠加分析 ==========
        function runOverlayAnalysis() {
            const layer1 = document.getElementById('overlayLayer1').value;
            const layer2 = document.getElementById('overlayLayer2').value;
            const type = document.getElementById('overlayType').value;
            
            const mockPolygon = createRandomPolygon(MIANYANG_CENTER, 8000);
            const geom = new ol.geom.Polygon([mockPolygon]);
            
            const resultFeature = new ol.Feature({
                geometry: geom, type: 'overlay',
                layer1: layer1, layer2: layer2, operation: type
            });
            
            analysisLayer.getSource().clear();
            analysisLayer.getSource().addFeature(resultFeature);
            
            const geojson = JSON.parse(new ol.format.GeoJSON().writeGeometry(geom));
            const area = (typeof turf !== 'undefined' ? turf.area(geojson) / 1000000 : 15).toFixed(2);
            
            addResult({
                type: 'overlay',
                description: `叠加分析：${layer1} ∩ ${layer2}`,
                operation: type, area: area,
                timestamp: new Date().toLocaleTimeString('zh-CN')
            });
            
            addLog('叠加分析', `${layer1} + ${layer2} - ${type}`);
            showToast('叠加分析完成');
        }
        
        // ========== 路径规划 ==========
        function updatePathUI() {
            document.getElementById('startPointStatus').textContent = pathPoints.start ? '已设置' : '未设置';
            document.getElementById('startPointStatus').className = pathPoints.start ? 
                'text-xs px-2 py-1 rounded bg-green-600' : 'text-xs px-2 py-1 rounded bg-gray-700';
            
            document.getElementById('endPointStatus').textContent = pathPoints.end ? '已设置' : '未设置';
            document.getElementById('endPointStatus').className = pathPoints.end ? 
                'text-xs px-2 py-1 rounded bg-green-600' : 'text-xs px-2 py-1 rounded bg-gray-700';
            
            if (tempLayer) {
                tempLayer.getSource().clear();
                if (pathPoints.start) {
                    tempLayer.getSource().addFeature(new ol.Feature({ geometry: new ol.geom.Point(pathPoints.start), type: 'start' }));
                }
                if (pathPoints.end) {
                    tempLayer.getSource().addFeature(new ol.Feature({ geometry: new ol.geom.Point(pathPoints.end), type: 'end' }));
                }
            }
        }
        
        function resetPathPoints() {
            pathPoints = { start: null, end: null };
            updatePathUI();
            if (tempLayer) tempLayer.getSource().clear();
        }
        
        function calculatePath() {
            if (!pathPoints.start || !pathPoints.end) {
                showToast('请先设置起点和终点');
                return;
            }
            
            const midX = (pathPoints.start[0] + pathPoints.end[0]) / 2;
            const midY = (pathPoints.start[1] + pathPoints.end[1]) / 2;
            
            const pathCoords = [
                pathPoints.start,
                [midX + 3000, midY - 2000],
                [midX - 2000, midY + 3000],
                pathPoints.end
            ];
            
            const lineString = new ol.geom.LineString(pathCoords);
            const pathFeature = new ol.Feature({ geometry: lineString, type: 'path' });
            
            analysisLayer.getSource().clear();
            analysisLayer.getSource().addFeature(pathFeature);
            
            analysisLayer.setStyle(new ol.style.Style({
                stroke: new ol.style.Stroke({ color: '#10B981', width: 4, lineDash: [10, 5] })
            }));
            
            const distance = ((Math.abs(pathPoints.start[0] - pathPoints.end[0]) + 
                              Math.abs(pathPoints.start[1] - pathPoints.end[1])) / 1000).toFixed(2);
            
            addResult({
                type: 'path',
                description: '逃生路径规划',
                distance: distance + ' km',
                timestamp: new Date().toLocaleTimeString('zh-CN')
            });
            
            addLog('路径规划', `距离：${distance}km`);
            showToast('路径计算完成');
        }
        
        // ========== 清除分析 ==========
        function clearAnalysis() {
            if (analysisLayer) analysisLayer.getSource().clear();
            if (tempLayer) tempLayer.getSource().clear();
            pathPoints = { start: null, end: null };
            updatePathUI();
            
            document.getElementById('resultsContent').innerHTML = `
                <div class="text-center text-gray-500 text-sm py-8">暂无分析结果</div>
            `;
            
            if (analysisLayer) {
                analysisLayer.setStyle(new ol.style.Style({
                    fill: new ol.style.Fill({ color: 'rgba(14, 165, 233, 0.4)' }),
                    stroke: new ol.style.Stroke({ color: '#0EA5E9', width: 2 })
                }));
            }
            
            showToast('已清除所有分析结果');
        }
        
        // ========== 地图点击处理 ==========
        function handleMapClick(evt) {
            if (currentTool === 'buffer') {
                const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);
                if (feature && feature.get('type') !== 'buffer' && feature.get('type') !== 'path') {
                    runBufferOnFeature(feature);
                } else if (!feature) {
                    showToast('请点击传感器点或风险区域');
                }
            } else if (currentTool === 'path') {
                if (!pathPoints.start) {
                    pathPoints.start = evt.coordinate;
                    updatePathUI();
                    showToast('起点已设置，请点击设置终点');
                } else if (!pathPoints.end) {
                    pathPoints.end = evt.coordinate;
                    updatePathUI();
                    showToast('终点已设置，点击"计算路径"生成路线');
                }
            }
        }
        
        // ========== 地图初始化（关键：target 必须匹配容器 id）==========
        function initMap() {
            // 底图 - 卫星影像
            const baseLayer = new ol.layer.Tile({
                source: new ol.source.XYZ({
                    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
                })
            });
            
            // 风险区域图层（用于点击分析）
            const riskSource = new ol.source.Vector();
            for (let i = 0; i < 15; i++) {
                const coords = [MIANYANG_CENTER[0] + (Math.random() - 0.5) * 40000, MIANYANG_CENTER[1] + (Math.random() - 0.5) * 40000];
                const polygon = createRandomPolygon(coords, 3000 + Math.random() * 5000);
                const feature = new ol.Feature({
                    geometry: new ol.geom.Polygon([polygon]),
                    riskLevel: ['low', 'medium', 'high'][Math.floor(Math.random() * 3)],
                    type: 'risk'
                });
                riskSource.addFeature(feature);
            }
            
            riskLayer = new ol.layer.Vector({
                source: riskSource,
                style: function(feature) {
                    const level = feature.get('riskLevel');
                    const color = level === 'high' ? 'rgba(239, 68, 68, 0.5)' : 
                                 level === 'medium' ? 'rgba(245, 158, 11, 0.5)' : 'rgba(16, 185, 129, 0.5)';
                    return new ol.style.Style({
                        fill: new ol.style.Fill({ color: color }),
                        stroke: new ol.style.Stroke({ color: '#fff', width: 1 })
                    });
                }
            });
            
            // 传感器点位
            const sensorSource = new ol.source.Vector();
            for (let i = 0; i < 30; i++) {
                const coords = [MIANYANG_CENTER[0] + (Math.random() - 0.5) * 35000, MIANYANG_CENTER[1] + (Math.random() - 0.5) * 35000];
                const feature = new ol.Feature({
                    geometry: new ol.geom.Point(coords),
                    type: 'sensor',
                    id: 'S' + String(i + 1).padStart(4, '0')
                });
                sensorSource.addFeature(feature);
            }
            
            const sensorLayer = new ol.layer.Vector({
                source: sensorSource,
                style: new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: 6,
                        fill: new ol.style.Fill({ color: '#0EA5E9' }),
                        stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                    })
                })
            });
            
            // 分析结果图层
            analysisLayer = new ol.layer.Vector({
                source: new ol.source.Vector(),
                style: new ol.style.Style({
                    fill: new ol.style.Fill({ color: 'rgba(14, 165, 233, 0.4)' }),
                    stroke: new ol.style.Stroke({ color: '#0EA5E9', width: 2 })
                })
            });
            
            // 临时图层（路径点）
            tempLayer = new ol.layer.Vector({ source: new ol.source.Vector() });
            
            // ✅ 关键：target 必须与容器 id 一致，容器是 <div id="map">
            map = new ol.Map({
                target: 'map',
                layers: [baseLayer, riskLayer, sensorLayer, analysisLayer, tempLayer],
                view: new ol.View({
                    center: MIANYANG_CENTER,
                    zoom: 12,
                    minZoom: 10,
                    maxZoom: 18
                })
            });
            
            // 点击事件
            map.on('click', handleMapClick);
            
            // 加载日志
            loadLogs();
            
            console.log('地图初始化成功，容器ID: map');
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
